name: Firmware build and controller tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: pio run -e nanoatmega328
      - name: Controller regressions
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/LineFollower tests/test_control.cpp -o /tmp/test_control
          /tmp/test_control
